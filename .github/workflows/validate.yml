name: Validate extension

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript
        run: |
          node --check content.js
          node --check popup.js
          node --check background.js

      - name: Validate manifest
        run: node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.json','utf8')); if (m.manifest_version !== 3) process.exit(1); for (const p of ['assets/icon16.png','assets/icon32.png','assets/icon48.png','assets/icon128.png']) if (!fs.existsSync(p)) process.exit(1);"
